<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Gold Bezel -->
  <rect x="2" y="2" width="28" height="24" fill="#fffff0" stroke="#000000" stroke-width="2"/>
  <!-- Decorative Header Border -->
  <line x1="5" y1="5" x2="27" y2="5" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="5" y1="8" x2="27" y2="8" stroke="#4682b4" stroke-width="1"/>
  <!-- Text line simulation -->
  <line x1="6" y1="11" x2="16" y2="11" stroke="#333333" stroke-width="1"/>
  <line x1="6" y1="14" x2="14" y2="14" stroke="#666666" stroke-width="1"/>
  <!-- Red Ribbon & Gold Medal Seal -->
  <polygon points="20,18 18,29 22,26 26,29 24,18" fill="#d9534f" stroke="#900000" stroke-width="1"/>
  <circle cx="22" cy="16" r="6" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="22" cy="16" r="3" fill="#ffffff" stroke="#b8860b" stroke-width="1"/>
</svg>
